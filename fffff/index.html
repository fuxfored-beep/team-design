<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>团队产出 / DESIGN ARCHIVE</title>
  <style>
    :root {
      --bg: #090a0c;
      --surface: #101216;
      --border: #1b1e26;
      --text: #eaeaea;
      --text-muted: #6b7280;
      --accent: #ffffff;
      --danger: #ff4757;
      --font-serif: "Didot", "Bodoni MT", "Playfair Display", "Songti SC", "SimSun", serif;
      --font-mono: "SF Mono", "Fira Code", "Roboto Mono", Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 60px 48px 160px;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1680px; margin: 0 auto; }

    /* 顶部标头 */
    header {
      margin-bottom: 56px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .header-left h1 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      color: #fff;
    }
    .header-left .subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .meta-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
    }

    /* 月份导航 */
    .month-nav-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 56px;
      flex-wrap: wrap;
    }
    .month-nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .month-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.25s ease;
    }
    .month-btn:hover { border-color: #fff; color: #fff; }
    .month-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
      font-weight: 600;
    }
    .add-month-btn {
      width: 36px;
      height: 36px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .add-month-btn:hover { border-color: #fff; color: #fff; transform: rotate(90deg); }

    /* 成员展区列表 */
    .members-list { display: flex; flex-direction: column; gap: 72px; width: 100%; }

    /* 个人区域卡片：平面画册排版 */
    .member-spread-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      padding: 48px 56px 56px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      width: 100%;
      position: relative;
    }

    /* 上部文字区域 */
    .spread-top-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 28px;
    }

    .title-typography-wrap {
      display: flex;
      align-items: baseline;
      gap: 18px;
      flex-wrap: wrap;
    }

    .spread-member-name {
      font-family: var(--font-serif);
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #ffffff;
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: baseline;
      transition: color 0.2s ease;
    }
    .spread-member-name:hover {
      color: #d1d5db;
    }
    .spread-secondary-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-style: italic;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .spread-top-meta {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .spread-works-count {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    .upload-link-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }
    .upload-link-btn:hover {
      background: #fff;
      color: #000;
    }
    .upload-link-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .file-input { display: none; }

    /* 下部展台 */
    .spread-gallery-area {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      width: 100%;
    }

    .spread-side-statement {
      flex: 0 0 180px;
      font-size: 0.72rem;
      line-height: 1.8;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 16px;
      margin-top: 4px;
    }

    /* 精密网格：一行 6 个，共 2 排（2行 × 6列 = 12格） */
    .precision-grid-two-rows {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      min-width: 0;
    }

    /* 独立全量详情 Page 展台 */
    .member-full-precision-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
    }

    /* 正方形单体素材卡片 */
    .square-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      overflow: visible; /* 允许悬停放大突破边框 */
    }

    /* 默认：裁切填满正方形，保证整齐精密度 */
    .square-box img, .square-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      transform-origin: center center;
    }

    /* 鼠标移入时：展示全图（contain）并放大 200%（scale 2.0） */
    .square-box:hover {
      z-index: 100;
    }
    .square-box:hover img, .square-box:hover video {
      object-fit: contain !important;
      transform: scale(2.0);
      background: #000;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .video-tag {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 8px;
      font-family: var(--font-mono);
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 1px;
      pointer-events: none;
      letter-spacing: 0.05em;
      z-index: 2;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 110;
    }
    .square-box:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--danger); border-color: var(--danger); }

    /* 正方形省略号卡片 */
    .more-square-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }
    .more-square-box:hover {
      border-color: #fff;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.02);
    }
    .more-symbol {
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
      letter-spacing: -0.05em;
    }
    .more-text {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .empty-grid-hint {
      grid-column: span 6;
      grid-row: span 2;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #3f4553;
      letter-spacing: 0.12em;
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }

    /* 成员专属详情 Page 视图 */
    .member-page-wrap { display: none; margin-top: 10px; }
    .member-page-wrap.show { display: block; animation: fadeIn 0.3s ease; }
    .member-page-nav { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      padding: 8px 18px;
      font-size: 0.82rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .back-btn:hover { border-color: #fff; }
    .page-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* 全屏大图模态框 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 32px;
      cursor: zoom-out;
    }
    .modal.show { display: flex; }
    .modal-content-box { max-width: 92vw; max-height: 92vh; display: flex; justify-content: center; align-items: center; }
    .modal-content-box img, .modal-content-box video {
      max-width: 92vw;
      max-height: 92vh;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1200px) {
      body { padding: 40px 24px 100px; }
      .spread-gallery-area { flex-direction: column; gap: 20px; }
      .spread-side-statement { width: 100%; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-left: 0; padding-top: 12px; }
      .precision-grid-two-rows, .member-full-precision-grid { grid-template-columns: repeat(3, 1fr); }
      .empty-grid-hint { grid-column: span 3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>团队产出</h1>
        <div class="subtitle">Design Outputs Archive</div>
      </div>
      <div class="meta-tag">ARCHIVE / 2026</div>
    </header>

    <!-- 月份导航 -->
    <div class="month-nav-wrap" id="monthNavContainer">
      <div class="month-nav" id="monthNav"></div>
      <button class="add-month-btn" onclick="addNewMonth()" title="新增下一个月份">+</button>
    </div>

    <!-- 成员画册展台列表 -->
    <main id="mainGridArea">
      <div class="members-list" id="membersList"></div>
    </main>

    <!-- 成员专属个人作品详情 Page -->
    <section class="member-page-wrap" id="memberPage">
      <div class="member-page-nav">
        <button class="back-btn" onclick="closeMemberPage()">← BACK TO ARCHIVE</button>
        <div class="page-title" id="pageTitleText"></div>
      </div>
      <div class="member-full-precision-grid" id="memberFullGrid"></div>
    </section>
  </div>

  <!-- 大图/视频模态框 -->
  <div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-content-box" id="modalContainer" onclick="event.stopPropagation()"></div>
  </div>

  <script>
    const GITEE_CONFIG = {
      owner: "design_19",
      repo: "design19",
      token: "8fbd6290dfb846bc0882ff90dedc8a51",
      dataFile: "data.json"
    };

    const defaultMembers = ["三七", "阿闯", "婉清", "天鸽", "袁博", "了了", "唐四", "小fu"];
    let monthList = JSON.parse(localStorage.getItem("team_design_months")) || ["2026年7月", "2026年8月", "2026年9月", "2026年10月"];
    let currentMonth = "2026年8月";
    let storedImages = [];
    let dataSha = null;
    let activeUploadRepo = GITEE_CONFIG.repo;

    function isVideoFile(filename = "") {
      return /\.(mp4|mov|webm|ogg)$/i.test(filename);
    }

    async function checkAndAutoMigrateRepo() {
      try {
        const repoUrl = `https://gitee.com/api/v5/repos/${GITEE_CONFIG.owner}/${activeUploadRepo}?access_token=${GITEE_CONFIG.token}`;
        const res = await fetch(repoUrl);
        if (res.ok) {
          const repoInfo = await res.json();
          if (repoInfo.size && repoInfo.size > 430080) {
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            const newRepoName = `${GITEE_CONFIG.repo}_${dateStr}_${Math.random().toString(36).slice(-3)}`;
            const createUrl = `https://gitee.com/api/v5/orgs/${GITEE_CONFIG.owner}/repos`;
            const createRes = await fetch(createUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json;charset=utf-8" },
              body: JSON.stringify({
                access_token: GITEE_CONFIG.token,
                name: newRepoName,
                has_issues: false,
                has_wiki: false,
                auto_init: true
              })
            });
            if (createRes.ok) {
              activeUploadRepo = newRepoName;
              localStorage.setItem("gitee_active_repo", activeUploadRepo);
              await new Promise(r => setTimeout(r, 2000));
            }
          }
        }
      } catch (e) {
        console.warn("容量检查跳过:", e);
      }
      return activeUploadRepo;
    }

    async function loadDataFromGitee() {
      try {
        const url = `https://gitee.com/api/v5/repos/${GITEE_CONFIG.owner}/${GITEE_CONFIG.repo}/contents/${GITEE_CONFIG.dataFile}?access_token=${GITEE_CONFIG.token}&_t=${Date.now()}`;
        const res = await fetch(url);
        if (res.ok) {
          const fileInfo = await res.json();
          dataSha = fileInfo.sha;
          const decoded = decodeURIComponent(escape(atob(fileInfo.content)));
          storedImages = JSON.parse(decoded) || [];
          localStorage.setItem("gitee_local_cache", JSON.stringify(storedImages));
        } else if (res.status === 404) {
          storedImages = [];
        }
      } catch (e) {
        const cached = localStorage.getItem("gitee_local_cache");
        if (cached) storedImages = JSON.parse(cached);
      }
    }

    async function syncDataToGitee(newList) {
      storedImages = newList;
      localStorage.setItem("gitee_local_cache", JSON.stringify(storedImages));
      const contentStr = unescape(encodeURIComponent(JSON.stringify(storedImages)));
      const base64Content = btoa(contentStr);
      const url = `https://gitee.com/api/v5/repos/${GITEE_CONFIG.owner}/${GITEE_CONFIG.repo}/contents/${GITEE_CONFIG.dataFile}`;
      const payload = {
        access_token: GITEE_CONFIG.token,
        content: base64Content,
        message: "update data.json"
      };
      if (dataSha) payload.sha = dataSha;
      const method = dataSha ? "PUT" : "POST";
      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const resData = await res.json();
        dataSha = resData.content?.sha || null;
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
      });
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 1400;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round((h * MAX) / w); w = MAX; }
              else { w = Math.round((w * MAX) / h); h = MAX; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function uploadSingleFileToGitee(base64Content, extension, targetRepo) {
      const fileName = `${Date.now()}_${Math.random().toString(36).slice(-5)}.${extension}`;
      const path = `uploads/${fileName}`;
      const url = `https://gitee.com/api/v5/repos/${GITEE_CONFIG.owner}/${targetRepo}/contents/${path}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json;charset=utf-8" },
        body: JSON.stringify({
          access_token: GITEE_CONFIG.token,
          content: base64Content,
          message: `upload ${fileName}`
        })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "Gitee 上传失败");
      }
      const resData = await res.json();
      return {
        url: resData.content.download_url,
        path: path,
        sha: resData.content.sha,
        repo: targetRepo,
        name: fileName
      };
    }

    function renderMonthNav() {
      const nav = document.getElementById("monthNav");
      nav.innerHTML = "";
      monthList.forEach(m => {
        const btn = document.createElement("button");
        btn.className = `month-btn ${m === currentMonth ? "active" : ""}`;
        btn.textContent = m;
        btn.onclick = () => {
          currentMonth = m;
          closeMemberPage();
          renderMonthNav();
          renderCards();
        };
        nav.appendChild(btn);
      });
    }

    function addNewMonth() {
      const lastMonthStr = monthList[monthList.length - 1];
      const match = lastMonthStr.match(/(\d{4})年(\d{1,2})月/);
      let nextYear = 2026, nextM = 1;
      if (match) {
        let y = parseInt(match[1], 10);
        let m = parseInt(match[2], 10);
        if (m === 12) {
          nextYear = y + 1;
          nextM = 1;
        } else {
          nextYear = y;
          nextM = m + 1;
        }
      }
      const newMonth = `${nextYear}年${nextM}月`;
      if (!monthList.includes(newMonth)) {
        monthList.push(newMonth);
        localStorage.setItem("team_design_months", JSON.stringify(monthList));
      }
      currentMonth = newMonth;
      closeMemberPage();
      renderMonthNav();
      renderCards();
    }

    function renderCards() {
      const list = document.getElementById("membersList");
      list.innerHTML = "";

      defaultMembers.forEach((memberName, idx) => {
        const card = document.createElement("div");
        card.className = "member-spread-card";

        const allMemberImgs = storedImages.filter(img => img.month === currentMonth && img.member === memberName);

        // 上半部分：杂志风标头排版
        const topBanner = document.createElement("div");
        topBanner.className = "spread-top-banner";

        topBanner.innerHTML = `
          <div class="title-typography-wrap">
            <span class="spread-member-name" onclick="openMemberPage('${memberName}')" title="进入 ${memberName} 独立作品页">${memberName}</span>
            <span class="spread-secondary-title">DESIGN</span>
          </div>
          <div class="spread-top-meta">
            <div class="spread-works-count">[${allMemberImgs.length} WORKS]</div>
            <button type="button" class="upload-link-btn" id="upBtn_${idx}">+ UPLOAD</button>
          </div>
        `;

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*,video/mp4,video/quicktime,video/webm";
        fileInput.multiple = true;
        fileInput.className = "file-input";

        const uploadBtn = topBanner.querySelector(`#upBtn_${idx}`);
        uploadBtn.onclick = () => fileInput.click();

        fileInput.onchange = async (e) => {
          const files = Array.from(e.target.files);
          if (!files || files.length === 0) return;
          uploadBtn.disabled = true;

          try {
            uploadBtn.innerText = "CHECKING...";
            const targetRepo = await checkAndAutoMigrateRepo();
            const newUploadedItems = [];

            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              uploadBtn.innerText = `UP (${i + 1}/${files.length})...`;

              const isVid = isVideoFile(file.name);
              if (isVid && file.size > 70 * 1024 * 1024) {
                alert(`视频 ${file.name} 超过 70MB，无法上传。`);
                continue;
              }

              let rawBase64 = "";
              let ext = "jpg";
              if (isVid) {
                rawBase64 = await readFileAsBase64(file);
                ext = file.name.split('.').pop().toLowerCase() || "mp4";
              } else {
                rawBase64 = await compressImageToBase64(file);
                ext = "jpg";
              }

              const fileInfo = await uploadSingleFileToGitee(rawBase64, ext, targetRepo);
              newUploadedItems.push({
                id: `${Date.now()}_${Math.random().toString(36).slice(-5)}`,
                month: currentMonth,
                member: memberName,
                name: fileInfo.name,
                url: fileInfo.url,
                path: fileInfo.path,
                sha: fileInfo.sha,
                repo: fileInfo.repo
              });
            }

            uploadBtn.innerText = "SYNCING...";
            await syncDataToGitee([...storedImages, ...newUploadedItems]);
            renderCards();
          } catch (err) {
            alert("上传失败: " + (err.message || err));
          } finally {
            uploadBtn.disabled = false;
            uploadBtn.innerText = "+ UPLOAD";
            fileInput.value = "";
          }
        };

        topBanner.appendChild(fileInput);
        card.appendChild(topBanner);

        // 下半部分：画廊展台
        const galleryArea = document.createElement("div");
        galleryArea.className = "spread-gallery-area";

        const sideStatement = document.createElement("div");
        sideStatement.className = "spread-side-statement";
        sideStatement.innerHTML = `
          COLLECTION / ${currentMonth}<br>
          CREATIVE OUTPUT & EXPERIMENTS BY ${memberName}.
        `;
        galleryArea.appendChild(sideStatement);

        // 精密正方形网格：2行 × 6列 = 12格
        const gallery = document.createElement("div");
        gallery.className = "precision-grid-two-rows";

        if (allMemberImgs.length === 0) {
          gallery.innerHTML = `<div class="empty-grid-hint">[NO OUTPUT DOCUMENTED]</div>`;
        } else {
          const TOTAL_SLOTS = 12;
          const hasMore = allMemberImgs.length > TOTAL_SLOTS;
          const displayCount = hasMore ? (TOTAL_SLOTS - 1) : allMemberImgs.length;
          const displaySlice = allMemberImgs.slice(0, displayCount);

          displaySlice.forEach(itemRecord => {
            gallery.appendChild(createMediaElement(itemRecord));
          });

          if (hasMore) {
            const moreBtn = document.createElement("div");
            moreBtn.className = "more-square-box";
            moreBtn.title = "查看全部作品";
            moreBtn.innerHTML = `
              <div class="more-symbol">···</div>
              <div class="more-text">+${allMemberImgs.length - displayCount} ALL</div>
            `;
            moreBtn.onclick = () => openMemberPage(memberName);
            gallery.appendChild(moreBtn);
          }
        }

        galleryArea.appendChild(gallery);
        card.appendChild(galleryArea);

        list.appendChild(card);
      });
    }

    function createMediaElement(itemRecord) {
      const isVid = isVideoFile(itemRecord.name || itemRecord.path || itemRecord.url);
      const box = document.createElement("div");
      box.className = "square-box";
      const fileRepo = itemRecord.repo || GITEE_CONFIG.repo;

      if (isVid) {
        box.innerHTML = `
          <video src="${itemRecord.url}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
          <span class="video-tag">VIDEO</span>
          <button class="delete-btn" title="删除" onclick="event.stopPropagation(); deleteImage('${itemRecord.id}', '${itemRecord.path}', '${itemRecord.sha}', '${fileRepo}')">×</button>
        `;
        box.onclick = () => openModal(itemRecord.url, true);
      } else {
        box.innerHTML = `
          <img src="${itemRecord.url}" alt="设计图" loading="lazy">
          <button class="delete-btn" title="删除" onclick="event.stopPropagation(); deleteImage('${itemRecord.id}', '${itemRecord.path}', '${itemRecord.sha}', '${fileRepo}')">×</button>
        `;
        box.onclick = () => openModal(itemRecord.url, false);
      }
      return box;
    }

    // 成员专属详情 Page
    function openMemberPage(memberName) {
      document.getElementById("mainGridArea").style.display = "none";
      const pageWrap = document.getElementById("memberPage");
      pageWrap.classList.add("show");

      document.getElementById("pageTitleText").textContent = `${memberName} — ${currentMonth} ARCHIVE`;
      const fullGrid = document.getElementById("memberFullGrid");
      fullGrid.innerHTML = "";

      const memberAll = storedImages.filter(img => img.month === currentMonth && img.member === memberName);
      memberAll.forEach(img => {
        fullGrid.appendChild(createMediaElement(img));
      });
    }

    function closeMemberPage() {
      document.getElementById("memberPage").classList.remove("show");
      document.getElementById("mainGridArea").style.display = "block";
    }

    async function deleteImage(id, path, sha, fileRepo) {
      if (!confirm("确认从云端删除此项产出？")) return;
      try {
        const filtered = storedImages.filter(img => img.id !== id);
        await syncDataToGitee(filtered);
        if (path && sha) {
          const repoToDeleteFrom = fileRepo || GITEE_CONFIG.repo;
          const url = `https://gitee.com/api/v5/repos/${GITEE_CONFIG.owner}/${repoToDeleteFrom}/contents/${path}`;
          fetch(url, {
            method: "DELETE",
            headers: { "Content-Type": "application/json;charset=utf-8" },
            body: JSON.stringify({
              access_token: GITEE_CONFIG.token,
              sha: sha,
              message: `delete ${path}`
            })
          }).catch(console.warn);
        }
        renderCards();
        const pageWrap = document.getElementById("memberPage");
        if (pageWrap.classList.contains("show")) {
          const currentViewingName = document.getElementById("pageTitleText").textContent.split("—")[0]?.trim();
          if (currentViewingName) openMemberPage(currentViewingName);
        }
      } catch (e) {
        alert("删除失败: " + e.message);
      }
    }

    function openModal(src, isVid) {
      const modal = document.getElementById("modal");
      const box = document.getElementById("modalContainer");
      if (isVid) {
        box.innerHTML = `<video src="${src}" controls autoplay playsinline></video>`;
      } else {
        box.innerHTML = `<img src="${src}" alt="大图预览">`;
      }
      modal.classList.add("show");
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      const box = document.getElementById("modalContainer");
      box.innerHTML = "";
      modal.classList.remove("show");
    }

    async function init() {
      const cached = localStorage.getItem("gitee_local_cache");
      if (cached) {
        try { storedImages = JSON.parse(cached); } catch(e) {}
      }
      renderMonthNav();
      renderCards();
      await loadDataFromGitee();
      renderCards();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
